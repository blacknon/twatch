[package]
name = "twatch"
version = "0.1.4"
edition = "2024"
description = "twatch - record, rewind, and diff terminal UI screens."
license = "MIT"
readme = "README.md"
keywords = ["tui", "terminal", "watch", "pty", "history"]
categories = ["command-line-utilities"]
repository = "https://github.com/blacknon/twatch"
homepage = "https://github.com/blacknon/twatch"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
flate2 = "1.1"
portable-pty = "0.9"
ratatui = "0.30"
regex = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
shell-words = "1.1"
similar = "2.7"
time = { version = "0.3", features = ["formatting", "local-offset", "macros"] }
unicode-width = "0.1"
vt100 = "0.16.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = [
    "handleapi",
    "jobapi2",
    "processthreadsapi",
    "tlhelp32",
    "winnt",
] }
