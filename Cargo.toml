[package]
name = "twatch"
version = "0.1.0"
edition = "2024"
description = "twatch"
license = "MIT"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
flate2 = "1.1"
portable-pty = "0.9"
ratatui = "0.29"
regex = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
shell-words = "1.1"
time = { version = "0.3", features = ["formatting", "local-offset", "macros"] }
vt100 = "0.15"
